<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121419" />
    <script>
      try {
        const saved = localStorage.getItem('starlight-theme')
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
